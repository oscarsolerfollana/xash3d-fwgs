// custom-xash / cstrike13 - el pack completo activo de serie.
// Este fichero solo existe en Proyectos\custom-xash: la carpeta oficial no lo
// tiene, y aunque lea de ella con -rodir, lo de aqui manda.

bunnyhop 1          // re-salto automatico. el cap de velocidad de CS ya esta
                    // parcheado en los dlls de esta carpeta (patch_bhopcap.py)
wallhack 0.8        // mundo y brushes translucidos. de 0.1 a 0.95; 0 lo apaga
aimbot 180          // cono en grados; 180 = toda la pantalla. baja el numero para afinarlo
aimbot_head 0       // 0 = al pecho, 1 = a la cabeza
sv_novis 1          // el servidor manda TODAS las entidades, si no el wallhack
                    // solo ensena lo que el PVS ya dejaba ver

bind "SEMICOLON" "cheatmenu"   // la enye en teclado espanol: menu 1/2/0

echo "custom-xash: bunnyhop 1, wallhack 0.8, aimbot 180 (pecho), sv_novis 1. Enye = menu."
