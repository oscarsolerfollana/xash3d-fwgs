// custom-xash / valve - trucos y bunnyhop activos de serie.
// Este fichero solo existe en Proyectos\custom-xash: la carpeta oficial no lo
// tiene, y aunque lea de ella con -rodir, lo de aqui manda.

bunnyhop 1          // re-salto automatico manteniendo saltar. 2 = ademas lo cuenta por consola
wallhack 0.8        // mundo y brushes translucidos. de 0.1 a 0.95; 0 lo apaga
aimbot 180          // cono en grados; 180 = toda la pantalla. baja el numero para afinarlo
aimbot_head 0       // 0 = al pecho, 1 = a la cabeza
sv_novis 1          // visibilidad total: sin esto el servidor no te manda
                    // los jugadores que estan fuera de tu PVS y el wallhack
                    // no los puede ensenar. Solo cuenta si el servidor es tuyo.
                    // Si una campana de un jugador va a tirones, ponlo a 0.

bind "SEMICOLON" "cheatmenu"   // la enye en teclado espanol: menu 1/2/0

echo "custom-xash: bunnyhop 1, wallhack 0.8, aimbot 180 (pecho). Enye = menu de trucos."
